<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="header-placeholder"></div>

  <main id="main-content">
    <section class="page-hero">
      <div class="container">
        <h1>Contact Us</h1>
        <p class="page-subtitle">Have a question or suggestion? We'd love to hear from you.</p>
      </div>
    </section>

    <section class="content-section">
      <div class="container container-narrow">
        <form id="contact-form" class="contact-form card-shadow" novalidate>
          <div class="mb-3">
            <label for="contact-name" class="form-label">Name <span class="text-danger" aria-hidden="true">*</span></label>
            <input type="text" class="form-control" id="contact-name" name="name" required autocomplete="name" aria-required="true">
            <div class="invalid-feedback" id="name-error" role="alert"></div>
          </div>
          <div class="mb-3">
            <label for="contact-email" class="form-label">Email <span class="text-danger" aria-hidden="true">*</span></label>
            <input type="email" class="form-control" id="contact-email" name="email" required autocomplete="email" aria-required="true">
            <div class="invalid-feedback" id="email-error" role="alert"></div>
          </div>
          <div class="mb-3">
            <label for="contact-message" class="form-label">Message <span class="text-danger" aria-hidden="true">*</span></label>
            <textarea class="form-control" id="contact-message" name="message" rows="5" required aria-required="true"></textarea>
            <div class="invalid-feedback" id="message-error" role="alert"></div>
          </div>
          <div id="contact-feedback" class="contact-feedback" role="status" aria-live="polite" hidden></div>
          <button type="submit" class="btn btn-primary" id="contact-submit">Send Message</button>
        </form>

        <div class="contact-links" style="margin-top: 2rem; text-align: center;">
          <p>For quick answers, visit our <a href="faq.html">FAQ page</a> or learn more <a href="about.html">about TempMal</a>.</p>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>
